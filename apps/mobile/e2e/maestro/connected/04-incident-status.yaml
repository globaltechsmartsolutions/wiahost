appId: com.globaltech.wiahost
name: WIAHost mobile connected incident status
tags:
  - connected
  - incident
  - status
---
- launchApp:
    clearState: true
- assertVisible: "Entrar"
- tapOn:
    id: "login-email"
- inputText: "${WIAHOST_EMAIL}"
- tapOn:
    id: "login-password"
- inputText: "${WIAHOST_PASSWORD}"
- hideKeyboard
- tapOn: "Entrar en WIAHost"
- assertVisible: "Centro de mando movil"
- tapOn: "Activos"
- tapOn: "Nuevo"
- assertVisible: "Nuevo activo"
- tapOn:
    id: "property-name"
- inputText: "QA Status Home"
- tapOn:
    id: "property-internal-name"
- inputText: "QA-STATUS-01"
- tapOn:
    id: "property-address"
- inputText: "Calle Estado 1"
- tapOn:
    id: "property-city"
- inputText: "Madrid"
- tapOn:
    id: "property-province"
- inputText: "Madrid"
- scrollUntilVisible:
    element: "Crear activo"
    direction: DOWN
- tapOn: "Activo"
- tapOn: "Crear activo"
- assertVisible: "Activos"
- tapOn: "Riesgo"
- tapOn: "Nueva"
- assertVisible: "Nueva incidencia"
- tapOn: "QA Status Home"
- tapOn:
    id: "incident-title"
- inputText: "QA cambio estado mobile"
- tapOn:
    id: "incident-description"
- inputText: "Incidencia creada para validar cambios de estado desde Maestro."
- hideKeyboard
- tapOn: "Alta"
- scrollUntilVisible:
    element: "Crear incidencia"
    direction: DOWN
- tapOn: "Crear incidencia"
- assertVisible: "Riesgo"
- tapOn: "QA cambio estado mobile"
- assertVisible: "Estado de la incidencia"
- tapOn: "Investigando"
- assertVisible: "Investigando"
