appId: com.globaltech.wiahost
name: WIAHost mobile connected create property
tags:
  - connected
  - property
---
- launchApp:
    clearState: true
- assertVisible: "Entrar"
- tapOn:
    id: "login-email"
- inputText: "${WIAHOST_EMAIL}"
- tapOn:
    id: "login-password"
- inputText: "${WIAHOST_PASSWORD}"
- hideKeyboard
- tapOn: "Entrar en WIAHost"
- assertVisible: "Centro de mando movil"
- tapOn: "Activos"
- tapOn: "Nuevo"
- assertVisible: "Nuevo activo"
- tapOn:
    id: "property-name"
- inputText: "QA Maestro Sky"
- tapOn:
    id: "property-internal-name"
- inputText: "QA-MOB-01"
- tapOn:
    id: "property-address"
- inputText: "Calle QA 1"
- tapOn:
    id: "property-city"
- inputText: "Madrid"
- tapOn:
    id: "property-province"
- inputText: "Madrid"
- scrollUntilVisible:
    element: "Crear activo"
    direction: DOWN
- tapOn: "Activo"
- tapOn: "Crear activo"
- assertVisible: "Activos"
- assertVisible: "QA Maestro Sky"
