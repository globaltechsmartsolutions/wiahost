appId: com.globaltech.wiahost
name: WIAHost mobile connected create incident
tags:
  - connected
  - incident
---
- launchApp:
    clearState: true
- assertVisible: "Entrar"
- tapOn:
    id: "login-email"
- inputText: "${WIAHOST_EMAIL}"
- tapOn:
    id: "login-password"
- inputText: "${WIAHOST_PASSWORD}"
- hideKeyboard
- tapOn: "Entrar en WIAHost"
- assertVisible: "Centro de mando movil"
- tapOn: "Activos"
- tapOn: "Nuevo"
- assertVisible: "Nuevo activo"
- tapOn:
    id: "property-name"
- inputText: "QA Incident Home"
- tapOn:
    id: "property-internal-name"
- inputText: "QA-INC-01"
- tapOn:
    id: "property-address"
- inputText: "Calle Incidencia 1"
- tapOn:
    id: "property-city"
- inputText: "Madrid"
- tapOn:
    id: "property-province"
- inputText: "Madrid"
- scrollUntilVisible:
    element: "Crear activo"
    direction: DOWN
- tapOn: "Activo"
- tapOn: "Crear activo"
- assertVisible: "Activos"
- tapOn: "Riesgo"
- tapOn: "Nueva"
- assertVisible: "Nueva incidencia"
- tapOn: "QA Incident Home"
- tapOn:
    id: "incident-title"
- inputText: "QA incidencia mobile"
- tapOn:
    id: "incident-description"
- inputText: "Incidencia creada desde Maestro para validar flujo movil conectado."
- hideKeyboard
- tapOn: "Alta"
- scrollUntilVisible:
    element: "Crear incidencia"
    direction: DOWN
- tapOn: "Crear incidencia"
- assertVisible: "Riesgo"
- assertVisible: "QA incidencia mobile"
