name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Quality audits
        run: pnpm quality:ci

      - name: Build web
        run: pnpm build:web

      - name: Lighthouse CI
        continue-on-error: true
        run: pnpm lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: quality/reports/lighthouse
          if-no-files-found: ignore

      - name: Upload quality JSON reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-json-reports
          path: quality/reports/*.json
          if-no-files-found: ignore
