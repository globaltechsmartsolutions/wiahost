name: Release Check

on:
  workflow_dispatch:

jobs:
  release-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release gate
        run: pnpm release:check

      - name: Refresh quality summary with release report
        if: always()
        run: pnpm quality:summary

      - name: Upload release and quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-quality-reports
          path: quality/reports/*.json
          if-no-files-found: ignore
